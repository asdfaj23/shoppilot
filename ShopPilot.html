<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopPilot · 电商导购智能体</title>
<style>
  /* 字体栈对齐主流大模型 Web 端（DeepSeek/Kimi/GLM/Qwen）：系统中文字体优先，拉丁用系统 UI 字体 */
  :root {
    --bg:#0d0f14; --panel:#14171e; --panel2:#181c24; --line:#252a35;
    --txt:#e8eaf0; --dim:#8b93a3; --dim2:#5d6472;
    --accent:#4f8cff; --accent2:#7c5cff; --ok:#34c77b; --bad:#e05c5c;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "HarmonyOS Sans SC", "MiSans",
            "Source Han Sans SC", sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body { background:var(--bg); color:var(--txt); font-family:var(--font);
         min-height:100vh; display:flex; justify-content:center; padding:7vh 20px 60px; position:relative; overflow-x:hidden; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(900px 420px at 75% -8%, rgba(79,140,255,.14), transparent 60%),
               radial-gradient(700px 380px at 12% 108%, rgba(124,92,255,.10), transparent 60%); }
  .wrap { width:100%; max-width:860px; position:relative; }

  /* ---- Hero：问候式居中布局（对齐 DeepSeek/Kimi 首屏） ---- */
  .hero { text-align:center; margin-bottom:44px; }
  .logo { width:64px; height:64px; margin:0 auto 20px; border-radius:20px; display:flex; align-items:center; justify-content:center;
          font-size:30px; background:linear-gradient(135deg,#2f5fd0,#6d4fd8); box-shadow:0 8px 28px rgba(79,140,255,.35); }
  h1 { font-size:38px; font-weight:600; letter-spacing:.5px; }
  h1 em { font-style:normal; background:linear-gradient(90deg,var(--accent),var(--accent2));
          -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tagline { margin-top:12px; font-size:15.5px; color:var(--dim); letter-spacing:.3px; }

  /* ---- 状态胶囊 ---- */
  .pill { display:inline-flex; align-items:center; gap:8px; margin:22px auto 0; padding:7px 16px;
          border:1px solid var(--line); border-radius:999px; background:var(--panel); font-size:13px; color:var(--dim); cursor:default; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); animation:pulse 1.6s infinite; }
  .dot.up { background:var(--ok); box-shadow:0 0 6px rgba(52,199,123,.8); }
  @keyframes pulse { 50% { opacity:.45; } }

  /* ---- 主 CTA ---- */
  .cta-row { display:flex; gap:14px; justify-content:center; margin:30px 0 44px; }
  .cta { display:inline-flex; align-items:center; gap:8px; padding:13px 30px; border-radius:12px;
         font-size:15px; font-weight:600; text-decoration:none; cursor:pointer; transition:.18s; }
  .cta.primary { color:#fff; background:linear-gradient(135deg,#3f76e0,#6a4fd8); border:1px solid transparent;
                 box-shadow:0 6px 22px rgba(79,140,255,.32); }
  .cta.primary:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(79,140,255,.42); }
  .cta.ghost { color:var(--txt); background:var(--panel); border:1px solid var(--line); }
  .cta.ghost:hover { border-color:#3a4356; background:var(--panel2); }

  /* ---- 场景快捷卡片（对齐大模型首页 suggestion cards） ---- */
  .sec-title { font-size:13px; color:var(--dim2); letter-spacing:2px; margin-bottom:14px; text-align:center; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .card { display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:18px 16px; text-decoration:none; transition:.18s; }
  .card:hover { border-color:rgba(79,140,255,.55); background:var(--panel2); transform:translateY(-3px);
                box-shadow:0 10px 26px rgba(0,0,0,.35); }
  .card .ico { font-size:20px; }
  .card b { display:block; font-size:14.5px; font-weight:600; margin:10px 0 6px; }
  .card p { font-size:12.5px; color:var(--dim); line-height:1.65; }
  .card p code { color:#8ecfff; font-size:12px; }

  /* ---- 底部资源行 ---- */
  .links { display:flex; gap:10px; justify-content:center; margin-top:38px; flex-wrap:wrap; }
  .links a { font-size:13px; color:var(--dim); text-decoration:none; padding:8px 16px;
             border:1px solid var(--line); border-radius:999px; background:var(--panel); transition:.15s; }
  .links a:hover { color:var(--txt); border-color:#3a4356; }

  @media (max-width:720px) { .cards { grid-template-columns:repeat(2,1fr); } h1 { font-size:30px; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="logo">🛒</div>
    <h1>你好，我是 <em>ShopPilot</em></h1>
    <p class="tagline">你的电商导购 Agent —— 会比价、看口碑、读售后，每一步都给你依据，还越用越懂你</p>
    <div class="pill"><span class="dot" id="dot"></span><span id="stxt">正在检测服务状态…</span></div>
    <div class="cta-row">
      <a class="cta primary" id="enter" href="http://localhost:8601" target="_blank">开始对话 →</a>
      <a class="cta ghost" href="#" onclick="showStart();return false;">启动服务</a>
    </div>
  </section>

  <p class="sec-title">试着这样问我 · 点击直达</p>
  <div class="cards">
    <a class="card" target="_blank" href="http://localhost:8601/?q=预算500以内推荐一副降噪耳机">
      <div class="ico">🎁</div><b>选购推荐</b>
      <p><code>预算500以内推荐降噪耳机</code><br>约束筛选 + 推荐理由 + 依据编号</p>
    </a>
    <a class="card" target="_blank" href="http://localhost:8601/?q=蓝牙耳机A和蓝牙耳机F怎么选">
      <div class="ico">⚖️</div><b>商品对比</b>
      <p><code>蓝牙耳机A和F怎么选</code><br>维度表格 + 分场景结论</p>
    </a>
    <a class="card" target="_blank" href="http://localhost:8601/?q=蓝牙耳机A翻车点在哪">
      <div class="ico">⚠️</div><b>口碑解读</b>
      <p><code>蓝牙耳机A翻车点在哪</code><br>差评维度归因 + 避坑清单</p>
    </a>
    <a class="card" target="_blank" href="http://localhost:8601/?q=蓝牙耳机A保修多久">
      <div class="ico">🛡️</div><b>售后问答</b>
      <p><code>蓝牙耳机A保修多久</code><br>RAG 强制引用，来源可溯源</p>
    </a>
  </div>

  <div class="links">
    <a href="docs/design_review.html">📘 设计评审</a>
    <a href="docs/benchmark_report.md">📊 评测报告</a>
    <a href="docs/DESIGN.md">📐 设计决策</a>
    <a href="benchmark.bat">🧪 一键评测</a>
    <a href="README.md">🏠 README</a>
  </div>
</div>

<script>
  function check() {
    fetch('http://localhost:8601', {mode: 'no-cors'})
      .then(() => {
        document.getElementById('dot').classList.add('up');
        document.getElementById('stxt').textContent = '服务运行中 · 点击场景卡片直接提问';
      })
      .catch(() => {
        document.getElementById('dot').classList.remove('up');
        document.getElementById('stxt').textContent = '服务未启动 · 请双击项目根目录的 start.bat';
      });
  }
  function showStart() {
    alert('浏览器安全限制不允许网页直接启动本地进程。\n\n请双击项目根目录 g:\\agent_internship 下的 start.bat，\n回到本页待状态灯变绿后点击"开始对话"。');
  }
  check(); setInterval(check, 3000);
</script>
</body>
</html>
